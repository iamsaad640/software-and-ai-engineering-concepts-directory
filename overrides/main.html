{% extends "base.html" %}
{% block extrahead %}
  {{ super() }}
  <link rel="describedby" href="{{ 'llms.txt' | url }}" type="text/markdown">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | e }} | {{ config.site_name | e }}">
  <meta property="og:description" content="{{ config.site_description | e }}">
  <meta property="og:url" content="{{ page.canonical_url | e }}">
  <link rel="apple-touch-icon" href="{{ 'assets/brand/apple-touch-icon.png' | url }}">
  <meta property="og:image" content="{{ config.site_url }}assets/brand/social-preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Software &amp; AI Engineering Concepts — a directory for engineers by Saad Ahmed">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ config.site_url }}assets/brand/social-preview.jpg">
{% endblock %}
