name: Release directory
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release content
        run: python3 scripts/check.py
      - name: Check search JavaScript syntax
        run: node --check site-assets/search.js
      - name: Create annotated tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py
