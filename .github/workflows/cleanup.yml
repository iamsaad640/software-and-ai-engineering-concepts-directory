name: Clean merged branches
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: branch-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check branch cleanup rules
        run: python3 -m unittest discover -s tests
      - name: Remove unchanged merged branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cleanup_branches.py
