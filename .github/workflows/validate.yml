name: Validate directory
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install documentation dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-docs.txt
      - name: Validate catalog, generated Markdown, and site
        run: .venv/bin/python scripts/check.py
      - name: Check search JavaScript syntax
        run: node --check site-assets/shortcuts.js
      - name: Test merged-branch cleanup rules
        run: python3 -m unittest discover -s tests
